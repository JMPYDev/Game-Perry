'use strict';
/* ============================================================

   ============================================================ */

function makeSprite(rows, pal, outline) {
  const h = rows.length, w = rows[0].length, off = outline ? 1 : 0;
  const [c, x] = mkCanvas(w + off * 2, h + off * 2);
  const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && !!pal[rows[j][i]];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const col = pal[rows[j][i]]; if (col) px(x, col, i + off, j + off); }
  if (outline) {
    x.fillStyle = outline;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (solid(i, j)) continue;
      if (solid(i - 1, j) || solid(i + 1, j) || solid(i, j - 1) || solid(i, j + 1)) x.fillRect(i + off, j + off, 1, 1);
    }
  }
  return c;
}

/* ---------- Mole Antonelliana (silhouette parametrica) ---------- */
function drawMole(c, cx, baseY, s, col, snowCol) {
  const slabs = [[36,26],[32,6],[30,4],[24,4],[20,4],[17,4],[15,4],[13,4],[12,4],[11,4],[10,4],[10,4],[9,4],[11,2],[7,8],[4,4],[3,12],[2,6],[1,4]];
  let y = baseY;
  for (const [w, h] of slabs) {
    const hh = Math.max(1, Math.round(h * s)), ww = Math.max(1, Math.round(w * s)); y -= hh;
    px(c, col, Math.round(cx - ww / 2), y, ww, hh);
    if (snowCol) px(c, snowCol, Math.round(cx - ww / 2), y, ww, Math.max(1, Math.round(s * 0.8)));
  }
  const st = Math.max(1, Math.round(1.4 * s));
  px(c, col, Math.round(cx - st / 2), y - st * 3, st, st * 3); px(c, col, Math.round(cx - st * 1.5), y - st * 2, st * 3, st);
  const bh = Math.round(26 * s), bw = Math.round(36 * s), by = baseY - bh;
  for (let i = 1; i < 4; i++) px(c, mix(col, '#ffffff', .12), Math.round(cx - bw / 2 + i * bw / 4), by + Math.round(6 * s), 1, bh - Math.round(6 * s));
}

/* ---------- giocatore ---------- */
function playerUpdate() {
  const p = G.player;
  if (p.ride) { p.x += p.ride.dx; p.y += p.ride.dy; }
  p.prevY = p.y;
  if (p.inv > 0) p.inv--;

  const surf = p.onGround ? (SURF[p.ground] || SURF.ice) : SURF.air;
  const L = input.held.left && !input.held.right, R = input.held.right && !input.held.left;
  p.crouch = !!(input.held.down && p.onGround && !p.dashing);
  p.lookUp = input.held.up && p.onGround && Math.abs(p.vx) < .2 ? Math.min(20, p.lookUp + 1) : Math.max(0, p.lookUp - 2);
  if (p.dashCd > 0) p.dashCd--;
  if (input.pressed.b && p.dashCd === 0 && !p.dashing && !p.crouch) { p.dashing = 13; p.dashCd = 55; Snd.sfx('dash'); }
  if (p.dashing > 0) { p.dashing--; p.vx = p.facing * (p.dashing > 4 ? 2.9 : 2.0); if (p.dashing % 2 === 0) spawnP(p.x + p.w / 2 - p.facing * 6, p.y + 10 + Math.random() * 10, -p.facing * .6, 0, 14, '#cfe8ff', 2, 0); }

      if (Math.abs(p.vx) > maxV && Math.sign(p.vx) === dir) p.vx = lerp(p.vx, dir * maxV, .12);
      else { p.vx += dir * surf.acc; if (dir * p.vx > maxV) p.vx = dir * maxV; }
    } else { p.vx *= surf.fr; if (Math.abs(p.vx) < .03) p.vx = 0; }
  }
  // salto: buffer + coyote + altezza variabile
  if (input.pressed.a) p.jumpBuf = 8;
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (p.jumpBuf > 0 && p.coyote > 0 && !p.crouch) {
    p.vy = -4.5; p.jumpHold = 15; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; p.ride = null; Snd.sfx('jump');
    burst(p.x + p.w / 2, p.y + p.h, 4, surf.kind === 'mud' ? '#8a8a3a' : '#ffffff', 1.6, 1, 1, .08);
  } else if (p.jumpBuf > 0) p.jumpBuf--;
  let g = .245;
  if (p.vy < 0 && input.held.a && p.jumpHold > 0) { g = .115; p.jumpHold--; } else p.jumpHold = 0;
  if (p.dashing > 0) g *= .45;
  p.vy = Math.min(p.vy + g, 5.2);
  const wasGround = p.onGround, prevVy = p.vy;
  moveX(p); moveY(p);
  if (p.onGround && !wasGround) { p.landT = prevVy > 3.2 ? 6 : 3; const k = (SURF[p.ground] || SURF.ice).kind;
    burst(p.x + p.w / 2, p.y + p.h, 6, k === 'mud' ? '#8a8a3a' : k === 'puddle' ? '#7fc8ff' : k === 'ice' ? '#dcf7ff' : k === 'dirt' ? '#8a6238' : '#ffffff', 2.2, 1.3, 1, .1);
    if (k === 'mud' || k === 'puddle') Snd.sfx('splat'); }
  // passi
  if (p.onGround && Math.abs(p.vx) > .3 && !p.crouch) { p.stepT++; if (p.stepT % 9 === 0) { const k = surf.kind;
    if (k === 'snow') spawnP(p.x + p.w / 2 - p.facing * 3, p.y + p.h - 1, -p.facing * .3, -.35, 16, '#ffffff', 1, .02);
    else if (k === 'mud') burst(p.x + p.w / 2, p.y + p.h - 1, 3, '#8a8a3a', 1.6, 1.4, 1, .14);
    else if (k === 'puddle') burst(p.x + p.w / 2, p.y + p.h - 1, 3, '#7fc8ff', 1.8, 1.2, 1, .14);
    else if (k === 'ice' && Math.random() < .3) spawnP(p.x + p.w / 2 - p.facing * 4, p.y + p.h - 2, 0, -.2, 12, '#e8fbff', 1, 0); } }
  // acqua / dislivello a strapiombo
  if (p.y + p.h > WATER_Y + 5) { killPlayer(G.level === 2 ? 'pit' : 'water'); return; }
  // checkpoint e traguardo
  for (const f of G.ents.flags) if (!f.active && p.x + p.w / 2 > f.x) {
    f.active = true; f.t = 0; G.checkpoint = { x:f.x + 2, y:f.groundY }; addScore(1000, f.x + 8, f.groundY - 36); Snd.sfx('checkpoint');
    const lbl = f.skin === 'lamp' ? 'TAPPA SALVATA!' : 'TESI SALVATA!';
    G.pops.push({ x:f.x + 8, y:f.groundY - 46, text:lbl, t:0, big:true });
    burst(f.x + 8, f.groundY - 24, 10, f.skin === 'lamp' ? '#ffe27a' : '#4bd35a', 2.5, 2, 1, .06);
  }
  const goal = G.ents.goal; if (p.onGround && p.x + p.w / 2 > goal.x + 22) { if (G.level === 2) startHome(); else startVictory(); return; }

function killPlayer(kind) {

  else if (kind === 'pit') { Snd.sfx('fall'); p.vy = -1.2; p.vx *= .3; burst(p.x + p.w / 2, p.y + p.h, 10, '#c9b58f', 2.4, 1.6, 1, .1); }
  else { Snd.sfx('hurt'); p.vy = -4.4; p.vx = -p.facing * .5; G.shake = 12; }
}
function deadUpdate() {
  const p = G.player; p.deadT++;

  else { p.vy += .22; p.y += p.vy; p.x += p.vx; }

}
function respawn() {
  G.ents = spawnEnts(G.spec); G.bumps.clear(); G.parts.length = 0; G.pops.length = 0;
  const cp = G.checkpoint; G.player = newPlayer(cp.x, cp.y); G.player.inv = 110; G.fade = 30;
  for (const f of G.ents.flags) if (f.x + 2 <= cp.x) f.active = true;

    if (overlap(p, e)) { if (p.dashing > 0) defeat(e, e.y, false); else if (p.vy > 0 && p.y + p.h - e.y < 9) defeat(e, e.y, true); else { killPlayer('enemy'); return; } } }
  for (const s of G.ents.scongs) { if (!s.alive || s.vis < 4) continue; const box = { x:s.x, y:s.baseY - s.vis, w:s.w, h:s.vis };
    if (overlap(p, box)) { if (p.dashing > 0) defeat(s, box.y, false); else if (p.vy > 0 && p.y + p.h - box.y < 9) defeat(s, box.y, true); else { killPlayer('enemy'); return; } } }
}
function defeat(e, topY, bounce) {
  e.alive = false; e.squash = 26; const p = G.player; const pts = e.pts || 200;
  if (bounce) { p.vy = -3.6; p.onGround = false; p.jumpHold = 8; }
  addScore(pts, e.x + e.w / 2, topY - 6); Snd.sfx(e.sfx || 'stomp');
  burst(e.x + e.w / 2, topY + 6, 8, e.color || '#7fe0d8', 2.6, 2, 1, .12);
}

/* ---------- nemici, piattaforme, ambiente ---------- */
function entsUpdate() {
  const E = G.ents, cam = G.cam;
  for (const f of E.floes) { const px_ = f.x, py_ = f.y; f.x = f.x0 + Math.sin(G.t * f.spd + f.ph) * f.ampX; f.y = f.y0 + Math.sin(G.t * f.spd * 1.3 + f.ph) * f.ampY; f.dx = f.x - px_; f.dy = f.y - py_; }
  for (const m of E.melts) { switch (m.state) {
    case 1: m.t++; if (m.t === 1) Snd.sfx('crack'); if (m.t > 75) { m.state = 2; m.t = 0; } break;
    case 2: m.t++; if (m.t % 7 === 0) spawnP(m.x + 2 + Math.random() * (m.w - 4), m.y + m.h, 0, .4, 22, '#9fdcff', 1, .12); if (m.t > 48) { m.state = 3; m.t = 0; Snd.sfx('melt'); burst(m.x + m.w / 2, m.y + 6, 12, '#cdeeff', 3.2, 2, 1, .12); if (G.player.ride === m) G.player.ride = null; } break;
    case 3: m.t++; if (m.t > (G.env.thaw < .5 ? 210 : 380)) { m.state = 4; m.t = 0; if (Math.abs(m.x - G.player.x) < 260) Snd.sfx('freeze'); } break;
    case 4: m.t++; if (m.t % 4 === 0) spawnP(m.x + Math.random() * m.w, m.y + Math.random() * m.h, 0, -.15, 14, '#ffffff', 1, 0); if (m.t > 34) { m.state = 0; m.t = 0; } break;
  } }
  for (const e of E.germs) {
    if (!e.alive) { if (e.squash > 0) e.squash--; continue; }
    if (Math.abs(e.x - cam.x - W / 2) > W + 40) continue;
    e.x += e.dir * .42; e.anim++;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; } else if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }
  }
  for (const s of E.scongs) {
    if (!s.alive) { if (s.squash > 0) s.squash--; continue; }
    s.t = (s.t + 1) % 300; const t = s.t;
    s.vis = t < 120 ? 0 : t < 150 ? (t - 120) / 30 * 11 : t < 240 ? 11 : t < 270 ? (270 - t) / 30 * 11 : 0;
    if (t === 121 && Math.abs(s.x - cam.x - W / 2) < W) burst(s.x + 6, s.baseY, 5, s.color || '#7fc8ff', 1.8, 1.4, 1, .12);
  }
  for (const f of E.flags) if (f.active) f.t++;
  for (const [k, b] of G.bumps) { b.t++; if (b.t > 14) G.bumps.delete(k); }
  for (let i = G.pickups.length - 1; i >= 0; i--) { const k = G.pickups[i]; k.t++; k.y -= k.t < 12 ? 1.2 : .2; if (k.t > 42) G.pickups.splice(i, 1); }
  for (let i = G.pops.length - 1; i >= 0; i--) { const o = G.pops[i]; o.t++; o.y -= .35; if (o.t > 60) G.pops.splice(i, 1); }
}
function envUpdate() {
  const e = G.env, px_ = G.player.x; const act = px_ < ACT2_X ? 1 : px_ < ACT3_X ? 2 : 3;
  if (act !== e.act) {
    e.act = act; e.cycleT = 0;
    const nm = ACT_NAMES[G.level][act];
    if (act !== 1) { showBanner(nm[0], nm[1]); Snd.sfx(G.level === 2 ? 'arrive' : (act === 2 ? 'melt' : 'freeze')); }
  }
  if (G.level === 1) {
    let target = act === 1 ? 0 : act === 2 ? 1 : 0;
    if (act === 3) { e.cycleT++; target = (Math.floor(e.cycleT / 560) % 2 === 0) ? 0 : 1; }
    if (target !== e.target) { e.target = target; if (act === 3 && e.cycleT > 1) Snd.sfx(target ? 'melt' : 'freeze'); }
    e.thaw += clamp(target - e.thaw, -.012, .012); e.phase = target ? 'DISGELO' : 'GELO';
  } else {
    // STUNE MIA: avanzamento monotono verso il tramonto, nessun ciclo gelo/disgelo
    const target = act === 1 ? 0 : act === 2 ? .45 : 1;
    e.thaw += clamp(target - e.thaw, -.006, .006); e.phase = e.thaw > .55 ? 'TRAMONTO' : 'GIORNO';
  }
}
function particlesUpdate() {
  for (let i = G.parts.length - 1; i >= 0; i--) { const p = G.parts[i]; p.vy += p.g; p.x += p.vx; p.y += p.vy; if (--p.life <= 0) G.parts.splice(i, 1); }
  for (const f of G.snow) { f.y += f.s; f.x += Math.sin(G.t / 45 + f.ph) * .25; if (f.y > H) { f.y = -2; f.x = Math.random() * W; } if (f.x < -2) f.x = W; if (f.x > W + 2) f.x = 0; }
  if (G.level === 1 && G.env.thaw > .15 && Math.random() < G.env.thaw * .32) G.drips.push({ x:Math.random() * W | 0, y:36, vy:2.6 + Math.random() * 1.2 });
  for (let i = G.drips.length - 1; i >= 0; i--) { const d = G.drips[i]; d.y += d.vy; if (d.y > H) G.drips.splice(i, 1); }
  for (let i = G.confetti.length - 1; i >= 0; i--) { const c = G.confetti[i]; c.vy += .045; c.vx *= .99; c.x += c.vx + Math.sin((G.t + c.ph) / 9) * .5; c.y += Math.min(c.vy, 1.6); if (c.y > H + 4) G.confetti.splice(i, 1); }
  if (G.banner) { G.banner.t++; if (G.banner.t > G.banner.life) G.banner = null; }
  if (G.fade > 0) G.fade--; if (G.shake > 0) G.shake--; if (G.resetDone > 0) G.resetDone--;
}
function spawnConfetti(n, burstMode) {
  const cols = ['#4bd35a', '#ffffff', '#e63946', '#7fe3ff', '#ffe066'];
  for (let i = 0; i < n; i++) G.confetti.push(burstMode
    ? { x:W / 2 + (Math.random() - .5) * 40, y:120, vx:(Math.random() - .5) * 5, vy:-2.5 - Math.random() * 3, col:cols[i % 5], w:2 + (Math.random() < .5 ? 1 : 0), h:2, ph:Math.random() * 40 }
    : { x:Math.random() * W, y:-4, vx:(Math.random() - .5) * .8, vy:.3 + Math.random() * .6, col:cols[i % 5], w:2 + (Math.random() < .5 ? 1 : 0), h:2, ph:Math.random() * 40 });
}
function updateCamera(snap) {
  const p = G.player, cam = G.cam;
  const lookT = p.facing * 26 * (Math.abs(p.vx) > .3 ? 1 : .45); cam.look = lerp(cam.look, lookT, .05);
  let tx = clamp(p.x + p.w / 2 - W / 2 + cam.look, 0, LW_PX - W);
  let ty = clamp(p.y + p.h - 100, 0, LH_PX - H); ty = clamp(ty - p.lookUp * 1.4, 0, LH_PX - H);
  if (G.mode === 'victory' || G.mode === 'home') { tx = clamp(G.ents.goal.x + 32 - W / 2, 0, LW_PX - W); ty = LH_PX - H; }
  if (snap) { cam.x = tx; cam.y = ty; cam.look = lookT; } else { cam.x = lerp(cam.x, tx, .1); cam.y = lerp(cam.y, ty, .08); }
}

/* ---------- vittoria ---------- */
function startVictory() {
  G.mode = 'victory'; Music.stop(); Snd.sfx('victory'); G.vic = { phase:0, t:0 }; const p = G.player; p.dashing = 0; p.crouch = false; p.inv = 0;
}
function victoryPhysics() { const p = G.player; p.prevY = p.y; p.vy = Math.min(p.vy + .245, 5.2); moveX(p); moveY(p); if (p.onGround) { if (Math.abs(p.vx) > .2) p.anim += 1.2; } }
function victoryUpdate() {
  const p = G.player, v = G.vic; v.t++;
  if (v.phase === 0) {
    const tx = G.ents.goal.x + 32 - p.w / 2, d = tx - p.x;
    if (Math.abs(d) > 1.5) { p.vx = Math.sign(d) * 1; p.facing = Math.sign(d); } else { p.x = tx; p.vx = 0; p.facing = 1; v.phase = 1; v.t = 0; p.vy = -4.9; p.onGround = false; spawnConfetti(70, true); }
    victoryPhysics();
  } else if (v.phase === 1) {
    victoryPhysics(); if (v.t % 5 === 0) spawnConfetti(3);
    if (p.onGround && v.t > 12) { v.phase = 2; v.t = 0; G.finalBonus = G.lives * 1000 + Math.max(0, 300 - Math.floor(G.time / 60)) * 10; G.score += G.finalBonus; if (G.score > G.record) { G.record = G.score; G.newRecord = true; saveRecord(); } }
  } else {
    if (v.t < 420 && v.t % 6 === 0) spawnConfetti(2);
    if (v.t % 110 === 100) { p.vy = -3.4; p.onGround = false; }
    victoryPhysics();
    if (v.t > 200 && (input.pressed.b || input.pressed.select)) { returnToTitle(); return; }
    if (v.t > 200 && (input.pressed.a || input.pressed.start || input.pressed.pause || G.canvasTap)) { G.canvasTap = null; Snd.sfx('start'); G.mode = 'transition2'; G.tr = 0; return; }
  }
  entsUpdate(); particlesUpdate(); updateCamera(false);
}

/* ---------- STUNE MIA: sequenza finale "rientro a casa" ---------- */
function doorRect() {
  const g = G.ents.goal; return { x: g.x + 27, y: g.groundY - 28, w: 26, h: 36 };
}
function startHome() {
  G.mode = 'home'; Music.stop(); Snd.sfx('arrive'); G.home = { phase:0, t:0, open:0, textT:0 };
  const p = G.player; p.dashing = 0; p.crouch = false; p.inv = 0;
}
function homeUpdate() {
  const p = G.player, h = G.home, door = doorRect(); h.t++;
  if (h.phase === 0) {
    // il giocatore cammina fino a fermarsi davanti al portone
    const tx = door.x + door.w / 2 - p.w / 2, d = tx - p.x;
    if (Math.abs(d) > 1.2) { p.vx = Math.sign(d) * .85; p.facing = Math.sign(d); } else { p.x = tx; p.vx = 0; p.facing = 1; h.phase = 1; h.t = 0; }
    victoryPhysics();
  } else if (h.phase === 1) {
    p.vx = 0; victoryPhysics();
    if (h.t === 8) h.textT = 1;
    if (h.t > 55) { h.phase = 2; h.t = 0; Snd.sfx('door'); }
  } else if (h.phase === 2) {
    p.vx = 0; victoryPhysics(); h.open = Math.min(1, h.t / 34);
    if (h.t % 5 === 0 && h.open < 1) burst(door.x + door.w / 2, door.y + door.h - 4, 2, '#f0c56a', 1, .6, 1, .06);
    if (h.t > 40) { h.phase = 3; h.t = 0; }
  } else if (h.phase === 3) {
    // il giocatore entra fisicamente nel portone e viene coperto dall'ombra della soglia
    const tx = door.x + door.w / 2 - p.w / 2, d = tx - p.x;
    p.vx = Math.abs(d) > .6 ? .7 : 0; p.facing = 1; victoryPhysics();
    if (Math.abs(d) <= .6) { p.x = tx; if (h.t > 16) { h.phase = 4; h.t = 0; Snd.sfx('doorClose'); } }
  } else if (h.phase === 4) {
    if (h.t > 26) {
      h.phase = 5; h.t = 0;
      G.finalBonus = G.lives * 1000 + Math.max(0, 300 - Math.floor(G.time / 60)) * 10; G.score += G.finalBonus;
      if (G.score > G.record2) { G.record2 = G.score; G.newRecord = true; saveRecord2(); }
      Snd.sfx('home');
    }
  } else {
    if (h.t > 40 && (input.pressed.b || input.pressed.select)) { returnToTitle(); return; }
    if (h.t > 40 && (input.pressed.a || input.pressed.start || input.pressed.pause || G.canvasTap)) { G.canvasTap = null; newGame(2); return; }
  }
  entsUpdate(); particlesUpdate(); updateCamera(false);
}

/* ---------- macchina a stati ---------- */
function pauseGame(help) { if (G.mode !== 'play') return; G.mode = help ? 'help' : 'pause'; Music.stop(); Snd.sfx('pause'); }
function resumeGame() { G.mode = 'play'; Music.start(); Snd.sfx('blip'); }
// ritorno al menu iniziale: SELECT+START insieme, oppure B dalla pausa
function returnToTitle() {
  Music.stop(); Music.reset(); Snd.sfx('pause');
  G.mode = 'title'; G.banner = null; G.vic = null; G.home = null; G.fade = 0; G.shake = 0;
  G.parts.length = 0; G.pops.length = 0; G.confetti.length = 0; G.pickups.length = 0; G.drips.length = 0;
}
function comboToTitle() {
  return (input.held.select && input.pressed.start) || (input.held.start && input.pressed.select) ||
         (input.held.select && input.pressed.pause) || (input.held.pause && input.pressed.select);
}
function update() {
  G.t++;
  if (input.pressed.mute) toggleAudio();
  switch (G.mode) {
    case 'title':
      for (const f of G.snow) { f.y += f.s; f.x += Math.sin(G.t / 45 + f.ph) * .25; if (f.y > H) { f.y = -2; f.x = Math.random() * W; } }
      if (input.pressed.select || input.pressed.b) { G.mode = 'reset'; G.resetT = 0; Snd.sfx('pause'); break; }
      if (input.pressed.start || input.pressed.a || G.canvasTap) { G.canvasTap = null; unlockAudio(); Snd.sfx('start'); G.mode = 'transition'; G.tr = 0; }
      break;
    case 'reset':
      G.resetT++;
      for (const f of G.snow) { f.y += f.s; if (f.y > H) { f.y = -2; f.x = Math.random() * W; } }
      if (G.resetT > 8 && (input.pressed.b || input.pressed.a)) { G.record = 0; G.resetDone = 40; saveRecord(); Snd.sfx('cfu'); G.mode = 'title'; break; }
      if (G.resetT > 8 && (input.pressed.select || input.pressed.start || input.pressed.pause)) { Snd.sfx('blip'); G.mode = 'title'; }
      break;
    case 'transition':
      G.tr++; if (G.tr === 14) newGame(1); if (G.tr >= 44) G.mode = 'play';
      break;
    case 'transition2':
      G.tr++; if (G.tr === 14) newGame(2); if (G.tr >= 44) G.mode = 'play';

  text(ctx, 128, 82, 'STUNE MIA', '#ffe066', { align:'center', scale:2 });
  text(ctx, 128, 104, 'RIENTRO A CASA · OSTUNI D\'ESTATE', '#ffffff', { align:'center' });
  text(ctx, 128, 116, 'RECORD: ' + String(G.record2).padStart(9, '0'), '#7fc8ff', { align:'center' });
}
function drawResetConfirm() {
  ctx.fillStyle = 'rgba(4,8,24,.72)'; ctx.fillRect(0, 0, W, H);
  panel(62, 128);
  text(ctx, 128, 70, 'AZZERARE IL RECORD?', '#ffe066', { align:'center', scale:2 });
  text(ctx, 128, 90, 'RECORD ATTUALE: ' + String(G.record).padStart(9, '0'), '#ffffff', { align:'center' });
  text(ctx, 128, 104, 'A / B: SÌ, AZZERA', '#4bd35a', { align:'center' });
  text(ctx, 128, 115, 'SELECT / START: ANNULLA', '#cfe0ff', { align:'center' });
}
function drawTransition() {
  const tr = G.tr, a = Math.max(0, 1 - tr / 24);
  if (a > 0) { ctx.fillStyle = 'rgba(210,240,255,' + a + ')'; ctx.fillRect(0, 0, W, H); }
  const s = Math.max(0, 1 - tr / 44); ctx.fillStyle = 'rgba(0,0,0,' + (s * .6) + ')'; for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
}
function drawHome() {
  const h = G.home; if (!h) return;
  if (h.phase === 1 && h.textT) {
    ctx.fillStyle = 'rgba(10,18,50,.6)'; ctx.fillRect(0, 84, W, 16);
    text(ctx, 128, 88, h.t % 220 < 110 ? 'CASA, FINALMENTE.' : 'STUNE MIA.', '#ffe066', { align:'center' });
  }
  if (h.phase === 4) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, h.t / 26) + ')'; ctx.fillRect(0, 0, W, H); return; }
  if (h.phase < 5) return;
  const t = h.t;
  if (t < 30) { ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - t / 30) + ')'; ctx.fillRect(0, 0, W, H); }
  panel(32, 142);
  if (t > 16) text(ctx, 128, 36, 'STUNE MIA', '#ffe066', { align:'center', scale:2 });
  if (t > 45) text(ctx, 128, 54, 'RIENTRO A CASA', '#ffffff', { align:'center' });
  if (t > 75) text(ctx, 128, 64, 'OSTUNI - TEMPO ' + fmtTime(G.time), '#ffb347', { align:'center' });
  if (t > 105) text(ctx, 128, 74, 'IL SOLE CALA. LA PORTA È APERTA.', '#7fc8ff', { align:'center' });
  if (t > 140) { text(ctx, 128, 86, 'PUNTI', '#cfe0ff', { align:'center' }); text(ctx, 128, 94, String(G.score).padStart(9, '0'), '#ffe066', { align:'center', scale:2 }); }
  if (t > 165) text(ctx, 128, 112, 'RECORD: ' + String(G.record2).padStart(9, '0'), '#7fc8ff', { align:'center' });
  if (t > 180) { if (G.newRecord) { if ((t / 20 | 0) % 2 === 0) text(ctx, 128, 122, 'NUOVO RECORD!', '#4bd35a', { align:'center' }); } else text(ctx, 128, 122, 'FICO ' + G.cfu + '/' + G.cfuTotal + '   BONUS +' + G.finalBonus, '#cfe0ff', { align:'center' }); }
  if (t > 195) { if ((t / 26 | 0) % 2 === 0) text(ctx, 128, 132, 'A: RIGIOCA · B: MENU INIZIALE', '#ffffff', { align:'center' }); }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  switch (G.mode) {
    case 'title': drawTitle(); break;
    case 'reset': drawTitle(); drawResetConfirm(); break;
    case 'transition': if (G.tr < 14) drawTitle(); else { drawWorld(); drawWeather(); drawHUD(); } drawTransition(); break;
    case 'transition2': if (G.tr < 14) drawLevel2Card(); else { drawWorld(); drawWeather(); drawHUD(); } drawTransition(); break;
    default:
      drawWorld(); drawWeather(); drawHUD(); drawBanner();
      if (G.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + (G.fade / 40) + ')'; ctx.fillRect(0, 0, W, H); }
      if (G.mode === 'pause') drawPause(); else if (G.mode === 'help') drawHelp(); else if (G.mode === 'gameover') drawGameOver(); else if (G.mode === 'victory') drawVictory(); else if (G.mode === 'home') drawHome();
  }
}

/* ---------- ciclo principale e avvio ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(120, now - last); last = now; acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render(); requestAnimationFrame(frame);
}
function fit() {
  const st = document.getElementById('stage'), u = Math.min(st.clientWidth / 360, st.clientHeight / 660, 2.4);
  document.documentElement.style.setProperty('--u', u + 'px');
}
Snd.onUnlock = () => { if ((G.mode === 'play' || G.mode === 'transition') && !Music.playing) Music.start(); };
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') pauseGame(false); });
document.getElementById('audio').addEventListener('click', e => { e.preventDefault(); toggleAudio(); });
cvs.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); const r = cvs.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (G.mode === 'title' || G.mode === 'gameover') G.canvasTap = { x, y };
  else if (G.mode === 'home' && G.home && G.home.phase >= 5 && G.home.t > 40) G.canvasTap = { x, y };
  else if (G.mode === 'victory' && x >= VBTN.x - 8 && x <= VBTN.x + VBTN.w + 8 && y >= VBTN.y - 8 && y <= VBTN.y + VBTN.h + 10) G.canvasTap = { x, y }; });
fit(); requestAnimationFrame(frame);
})();
</script>
</body>
