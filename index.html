'use strict';
/* ============================================================

   ============================================================ */

function makeSprite(rows, pal, outline) {
  const h = rows.length, w = rows[0].length, off = outline ? 1 : 0;
  const [c, x] = mkCanvas(w + off * 2, h + off * 2);
  const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && !!pal[rows[j][i]];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const col = pal[rows[j][i]]; if (col) px(x, col, i + off, j + off); }
  if (outline) {
    x.fillStyle = outline;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (solid(i, j)) continue;
      if (solid(i - 1, j) || solid(i + 1, j) || solid(i, j - 1) || solid(i, j + 1)) x.fillRect(i + off, j + off, 1, 1);
    }
  }
  return c;
}

/* ---------- Mole Antonelliana (silhouette parametrica) ---------- */
function drawMole(c, cx, baseY, s, col, snowCol, xs) {
  const sw = s * (xs || 1);
  const S = v => Math.max(1, Math.round(v * s)), L1 = mix(col, '#ffffff', .13), L2 = mix(col, '#ffffff', .24), DK = mix(col, '#000000', .2);
  const caps = [];
  const bar = (w, y, h, color) => { const ww = Math.max(1, Math.round(w * sw)); px(c, color, Math.round(cx - ww / 2), y, ww, h); return ww; };
  let y = baseY;
  // basamento: zoccolo, corpo quadrato con lesene, cornicione
  y -= S(3); bar(47, y, S(3), DK);
  const bh = S(16); y -= bh; const bw = bar(38, y, bh, col);
  for (let i = 1; i < 6; i++) px(c, L1, Math.round(cx - bw / 2 + i * bw / 6), y + S(3), Math.max(1, Math.round(s * .8)), bh - S(3));
  y -= S(2); bar(41, y, S(2), L2); caps.push([41, y]);
  // ordine superiore con colonnato
  const t2 = S(9); y -= t2; const w2 = bar(29, y, t2, col);
  for (let i = 1; i < 5; i++) px(c, L1, Math.round(cx - w2 / 2 + i * w2 / 5), y + S(2), Math.max(1, Math.round(s * .8)), t2 - S(2));
  y -= S(2); bar(32, y, S(2), L2); caps.push([32, y]);
  // tamburo della cupola
  const t3 = S(5); y -= t3; bar(23, y, t3, col);
  y -= S(1); bar(26, y, S(1), L2); caps.push([26, y]);
  // cupola a ogiva, con costoloni
  const domeH = S(30), R = 11.8, prof = t => R * Math.pow(1 - Math.pow(t, 1.8), .55);
  for (let j = 0; j < domeH; j++) { const w = prof(j / domeH), ww = Math.max(1, Math.round(2 * w * sw)); px(c, col, Math.round(cx - ww / 2), y - j - 1, ww, 1);
    const wp = w * sw; for (const f of [-.74, -.42, .42, .74]) { if (Math.abs(f) * wp < wp - .6) px(c, f < 0 ? L1 : DK, Math.round(cx + f * wp), y - j - 1, 1, 1); }
    if (snowCol && j > domeH - S(4)) px(c, snowCol, Math.round(cx - ww / 2), y - j - 1, ww, 1); }
  y -= domeH;
  // lanternino a tempietto
  y -= S(1); bar(10, y, S(1), L2); caps.push([10, y]);
  const lh = S(6); y -= lh; const wl = bar(8, y, lh, col);
  px(c, L1, Math.round(cx - wl / 2 + Math.round(wl / 3)), y + S(1), Math.max(1, Math.round(s * .7)), lh - S(1));
  y -= S(1); bar(11, y, S(1), L2); caps.push([11, y]);
  // guglia rastremata con anelli
  const spH = S(34);
  for (let j = 0; j < spH; j++) { const t = j / spH, ww = Math.max(1, Math.round((4.7 * (1 - t) + .9) * sw)); px(c, col, Math.round(cx - ww / 2), y - j - 1, ww, 1);
    if (ww > 2) px(c, L1, Math.round(cx - ww / 2), y - j - 1, 1, 1); }
  for (const f of [.20, .46, .70]) { const yy = y - Math.round(spH * f), wr = (4.7 * (1 - f) + 2.8) * sw, ww = Math.max(2, Math.round(wr)); px(c, L2, Math.round(cx - ww / 2), yy, ww, Math.max(1, Math.round(s * .9))); }
  y -= spH;
  // stella in punta
  const st = Math.max(1, Math.round(1.2 * s)); px(c, L2, Math.round(cx - st / 2), y - st * 3, st, st * 3); px(c, L2, Math.round(cx - st * 1.5), y - st * 2, st * 3, st);
  if (snowCol) for (const [w, cy] of caps) bar(w, cy, Math.max(1, Math.round(s * .8)), snowCol);
}

function makeSky(top, mid, bot) { const [c, x] = mkCanvas(W, H); const n = 12; for (let i = 0; i < n; i++) { const t = i / (n - 1); x.fillStyle = t < .5 ? mix(top, mid, t * 2) : mix(mid, bot, (t - .5) * 2); x.fillRect(0, Math.round(i * H / n), W, Math.ceil(H / n) + 1); } return c; }
function mountain(x, cx, base, hw, h, col, snow) { for (let j = 0; j < h; j++) { const w = Math.round(hw * (j + 1) / h); x.fillStyle = (snow && j < h * .32) ? snow : col; x.fillRect(cx - w, base - h + j, 2 * w, 1); } }
function hill(x, cx, base, hw, h, col, shade) { for (let j = 0; j < h; j++) { const w = Math.round(hw * Math.sqrt((j + 1) / h)); x.fillStyle = col; x.fillRect(cx - w, base - h + j, 2 * w, 1); } x.fillStyle = shade; x.fillRect(cx - hw, base - 2, 2 * hw, 2); }
function pine(x, cx, base, h, thawed) {
  px(x,'#4a2f1c',cx-1,base-4,2,4);
  for (let t = 0; t < 3; t++) { const th = Math.round(h / 3) + 2, y0 = base - 4 - (3 - t) * Math.round(h / 3), hw = 3 + (3 - t) * 2;
    for (let j = 0; j < th; j++) { const w = Math.round(hw * (j + 1) / th); x.fillStyle = (j < 2 && !thawed) ? '#f7fbff' : (t % 2 ? '#2f6b4f' : '#3d8a63'); x.fillRect(cx - w, y0 + j, 2 * w, 1); } }
}

  const mx = 2038 - cx * .5, by = Math.round(150 + up * .5), gy = Math.max(0, GROUND_Y - cy);
  if (mx > -70 && mx < W + 70) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, gy); ctx.clip();
    const gx = Math.round(mx), pulse = .24 + Math.sin(G.t / 17) * .05;
    const gr = ctx.createRadialGradient(gx, by - 46, 3, gx, by - 46, 70);
    gr.addColorStop(0, 'rgba(255,214,132,' + (n * (pulse + .14)).toFixed(3) + ')');
    gr.addColorStop(.5, 'rgba(255,188,90,' + (n * pulse * .38).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,188,90,0)');
    ctx.fillStyle = gr; ctx.fillRect(gx - 74, by - 120, 148, 130);
    ctx.globalAlpha = n * .13; ctx.fillStyle = '#ffd98a';
    for (const d of [-40, -18, 18, 40]) for (let j = 0; j < 30; j++) ctx.fillRect(Math.round(gx + d * (1 - j / 90)), by - j, 2, 1);
    ctx.globalAlpha = 1;
    // sagoma in controluce, poi solo la parte battuta dai fari

    const lit = moleLit(); ctx.globalAlpha = n * (.86 + Math.sin(G.t / 17) * .07);
    ctx.drawImage(lit, gx - (lit.width >> 1), by - (lit.height - 4)); ctx.globalAlpha = 1;
    ctx.restore();
  }
  // podio e Ciccio tornano davanti al monumento
  ctx.save(); ctx.translate(-cx, -cy);
  if (G.ents.goal) ctx.drawImage(SPR.podium, G.ents.goal.x, G.ents.goal.groundY - 28);
  drawPlayer();
  ctx.restore();
  // fuochi d'artificio
  for (const f of G.fw) { const a = Math.max(0, 1 - f.life / f.max); ctx.globalAlpha = Math.min(1, a * 1.3); ctx.fillStyle = f.life < 4 ? '#ffffff' : f.col; ctx.fillRect(Math.round(f.x), Math.round(f.y), f.sz, f.sz); }
  ctx.globalAlpha = 1;
}
function drawWeather() {
  const env = G.env.thaw;
  if (G.level === 1) {
    if (env < .99) { ctx.globalAlpha = (1 - env) * .9; ctx.fillStyle = '#ffffff'; for (const f of G.snow) ctx.fillRect(Math.round(f.x), Math.round(f.y), f.sz, f.sz); ctx.globalAlpha = 1; }
    if (G.drips.length) { ctx.globalAlpha = Math.min(1, env) * .75; ctx.fillStyle = '#bfe6ff'; for (const d of G.drips) ctx.fillRect(d.x, Math.round(d.y), 1, 3); ctx.globalAlpha = 1; }
  } else {
    ctx.globalAlpha = env * .16; ctx.fillStyle = '#ff8a3d'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
  for (const c of G.confetti) { ctx.fillStyle = c.col; const wob = Math.sin((G.t + c.ph) / 6); ctx.fillRect(Math.round(c.x), Math.round(c.y), wob > 0 ? c.w : 1, c.h); }
}
function drawHUD() {
  px(ctx, '#141a2c', 4, 4, 19, 19); px(ctx, '#cfe0ff', 4, 4, 18, 18); px(ctx, '#22397a', 5, 5, 16, 16); ctx.drawImage(SPR.portrait, 6, 6);
  text(ctx, 26, 5, 'CICCIO PERRONE');
  ctx.drawImage(G.level === 2 ? SPR.bagIcon : SPR.scrollIcon, 26, 13); text(ctx, 34, 13, '×' + String(Math.max(0, G.lives)).padStart(2, '0'));
  text(ctx, 252, 5, 'PUNTI: ' + String(G.score).padStart(9, '0'), '#ffffff', { align:'right' });
  if (G.level === 1) {
    let fx = 252 - 119; fx += text(ctx, fx, 14, 'FASE: ') + 1; const gx = fx; fx += text(ctx, fx, 14, 'GELO', '#7fe3ff') + 1; fx += text(ctx, fx, 14, ' / ') + 1; const dx = fx; text(ctx, fx, 14, 'DISGELO', '#4bd35a');
    if (G.env.phase === 'GELO') px(ctx, '#7fe3ff', gx, 22, 23, 1); else px(ctx, '#4bd35a', dx, 22, 41, 1);
    text(ctx, 128, 25, 'TORINO - 16 SETTEMBRE 2026', '#ffffff', { align:'center' });
  } else {
    text(ctx, 128, 25, 'OSTUNI D\'ESTATE', '#ffffff', { align:'center' });
  }
  // scatto (B): barra di ricarica
  const p = G.player; text(ctx, 4, 25, 'B', '#cfe0ff'); px(ctx, '#141a2c', 10, 26, 18, 6); px(ctx, '#22397a', 11, 27, 16, 4);
  const f = p ? 1 - p.dashCd / 55 : 1; px(ctx, p && p.dashing ? '#ffffff' : f >= 1 ? '#7fe3ff' : '#ff7a59', 11, 27, Math.round(16 * f), 4);
}
function drawBanner() {
  const b = G.banner; if (!b || (G.mode !== 'play' && G.mode !== 'victory' && G.mode !== 'transition' && G.mode !== 'home' && G.mode !== 'transition2')) return;
  const a = b.t < 15 ? b.t / 15 : b.t > b.life - 20 ? (b.life - b.t) / 20 : 1; ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,18,50,.62)'; ctx.fillRect(0, 60, W, 14); text(ctx, 128, 63, b.text, b.color, { align:'center' }); ctx.globalAlpha = 1;
}
function panel(y0, y1) { ctx.fillStyle = 'rgba(8,14,40,.72)'; ctx.fillRect(0, y0, W, y1 - y0); px(ctx, '#7fe3ff', 0, y0, W, 1); px(ctx, '#7fe3ff', 0, y1 - 1, W, 1); }
function drawPause() {
  panel(48, 138); text(ctx, 128, 58, 'PAUSA', '#ffe066', { align:'center', scale:2 });
  text(ctx, 128, 80, 'START: RIPRENDI', '#ffffff', { align:'center' }); text(ctx, 128, 90, 'SELECT: ISTRUZIONI', '#cfe0ff', { align:'center' });
  text(ctx, 128, 100, 'B: MENU INIZIALE', '#ffe066', { align:'center' });
  const lbl = G.level === 2 ? 'FICO' : 'CFU';
  text(ctx, 128, 116, lbl + ' ' + G.cfu + '/' + G.cfuTotal + '   TEMPO ' + fmtTime(G.time), G.level === 2 ? '#ff8a3d' : '#7fe3ff', { align:'center' });
}
function drawHelp() {
  panel(36, 190); text(ctx, 128, 41, 'ISTRUZIONI', '#ffe066', { align:'center', scale:2 });
  const L = G.level === 2
    ? ['← →  MUOVI CICCIO', 'A  SALTA (TIENI = PIÙ ALTO)', 'B  SCATTO CON RICARICA', '↑  GUARDA IN ALTO   ↓  ABBASSATI', 'START  PAUSA   SELECT  AIUTO', 'SELECT+START: MENU INIZIALE', '', 'COLPISCI I BLOCCHI FICO DAL BASSO', 'SALTA SU GECHI E VESPE', 'ATTENTO AI DISLIVELLI DEI VICOLI', 'LAMPIONE ACCESO = CHECKPOINT', 'SELECT: TORNA AL GIOCO']
    : ['← →  MUOVI CICCIO', 'A  SALTA (TIENI = PIÙ ALTO)', 'B  SCATTO CON RICARICA', '↑  GUARDA IN ALTO   ↓  ABBASSATI', 'START  PAUSA   SELECT  AIUTO', 'SELECT+START: MENU INIZIALE', '', 'COLPISCI I BLOCCHI CFU DAL BASSO', 'SALTA SUI GERMI, EVITA L\'ACQUA', 'IL GHIACCIO SI SCIOGLIE: CORRI!', 'BANDIERINA TESI = CHECKPOINT', 'SELECT: TORNA AL GIOCO'];
  L.forEach((s, i) => { if (s) text(ctx, 128, 62 + i * 10, s, i >= 6 ? '#cfe0ff' : '#ffffff', { align:'center' }); });
}
function drawGameOver() {
  panel(50, 136); text(ctx, 128, 60, 'GAME OVER', '#ff7a59', { align:'center', scale:2 });
  text(ctx, 128, 86, G.level === 2 ? 'IL VIAGGIO CONTINUA: RIPROVA' : 'IL GELO NON HA VINTO: RIPROVA', '#ffffff', { align:'center' });
  text(ctx, 128, 100, 'PUNTI: ' + String(G.score).padStart(9, '0'), '#ffe066', { align:'center' });
  if ((G.t / 30 | 0) % 2 === 0) text(ctx, 128, 112, 'PREMI START', '#7fe3ff', { align:'center' });
  text(ctx, 128, 122, 'B: MENU INIZIALE', '#cfe0ff', { align:'center' });
}
function fmtTime(steps) { const s = Math.floor(steps / 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const VIC_DELAY = 240; // 4 secondi: lascia respirare la scena notturna
function drawVictory() {
  const v = G.vic; if (v.phase < 2) return; const t = v.t - VIC_DELAY; if (t < 0) return;
  panel(36, 122);
  if (t > 20) text(ctx, 128, 39, 'LAUREA COMPLETATA!', '#ffe066', { align:'center', scale:2 });
  if (t > 55) text(ctx, 128, 57, 'DOTT. CICCIO PERRONE', '#ffffff', { align:'center' });
  if (t > 85) text(ctx, 128, 67, 'TORINO, 16 SETTEMBRE 2026', '#cfe0ff', { align:'center' });
  if (t > 115) text(ctx, 128, 77, 'IL GELO PASSA. IL TRAGUARDO RESTA.', '#7fe3ff', { align:'center' });
  if (t > 150) { text(ctx, 128, 89, 'PUNTI', '#cfe0ff', { align:'center' }); text(ctx, 128, 97, String(G.score).padStart(9, '0'), '#ffe066', { align:'center', scale:2 }); }
  if (t > 175) { if (G.newRecord) { if ((t / 20 | 0) % 2 === 0) text(ctx, 128, 113, 'NUOVO RECORD!', '#4bd35a', { align:'center' }); } else text(ctx, 128, 113, 'CFU ' + G.cfu + '/' + G.cfuTotal + '   BONUS +' + G.finalBonus, '#cfe0ff', { align:'center' }); }
  if (t > 200) { const b = VBTN, pr = input.held.a || input.held.start; const y = b.y + (pr ? 2 : 0);
    px(ctx, '#141a2c', b.x, b.y, b.w, b.h + 3); px(ctx, '#7e2a24', b.x, y + 2, b.w, b.h); px(ctx, pr ? '#a33a31' : '#b4453b', b.x, y, b.w, b.h); px(ctx, '#dc7266', b.x + 1, y + 1, b.w - 2, 1);
    text(ctx, 128, y + 5, 'CONTINUA', '#ffffff', { align:'center' }); }
  if (t > 230 && (t / 26 | 0) % 2 === 0) text(ctx, 128, 181, 'PROSSIMO LIVELLO: STUNE MIA', '#ffb347', { align:'center' });
}
function drawTitle() {
  if (TITLE_BG.complete && TITLE_BG.naturalWidth) ctx.drawImage(TITLE_BG, 0, 0, W, H);
  else { ctx.drawImage(BG.skyTitle, 0, 0); layer(BG.far, G.t * .04, 54, 512); drawMole(ctx, 186, 142, 1.25, '#2c3f74', '#f7fbff'); layer(BG.nearCold, G.t * .1, 78, 320); }
  ctx.fillStyle = 'rgba(6,12,34,.12)'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < 18; y++) { ctx.fillStyle = 'rgba(8,14,40,' + (.5 - .5 * (y / 17)).toFixed(3) + ')'; ctx.fillRect(0, y, W, 1); }
  ctx.globalAlpha = .9; ctx.fillStyle = '#ffffff'; for (const f of G.snow) ctx.fillRect(Math.round(f.x), Math.round(f.y), f.sz, f.sz); ctx.globalAlpha = 1;
  // tutte le scritte nel pannello in basso: il volto resta libero
  ctx.fillStyle = 'rgba(8,14,40,.86)'; ctx.fillRect(0, 112, W, 80); px(ctx, '#7fe3ff', 0, 112, W, 1);
  for (let y = 0; y < 10; y++) { ctx.fillStyle = 'rgba(8,14,40,' + (.62 * (y / 9)).toFixed(3) + ')'; ctx.fillRect(0, 102 + y, W, 1); }
  text(ctx, 128, 116, 'CICCIO PERRONE', '#ffe066', { align:'center', scale:2 });
  let x = 128 - textWidth('CICLO DEL GELO E DISGELO') / 2; x += text(ctx, x, 133, 'CICLO DEL ') + 1; x += text(ctx, x, 133, 'GELO', '#7fe3ff') + 1; x += text(ctx, x, 133, ' E ') + 1; text(ctx, x, 133, 'DISGELO', '#4bd35a');
  text(ctx, 128, 143, 'TORINO - 16 SETTEMBRE 2026', '#ffffff', { align:'center' });
  if ((G.t / 28 | 0) % 2 === 0) text(ctx, 128, 157, 'PREMI START', '#ffe066', { align:'center' });
  if (G.resetDone > 0) text(ctx, 128, 169, 'RECORD AZZERATO', '#4bd35a', { align:'center' });
  else text(ctx, 128, 169, 'RECORD: ' + String(G.record).padStart(9, '0'), '#7fe3ff', { align:'center' });
  text(ctx, 128, 180, 'SELECT: AZZERA RECORD', '#8fa4c8', { align:'center' });
}
function drawLevel2Card() {
  ctx.drawImage(BG.skySunset, 0, 0);
  layer(BG.mid2, G.t * .06, 40, 1400); layer(BG.near2, G.t * .12, 90, 2880);
  ctx.fillStyle = 'rgba(8,14,40,.5)'; ctx.fillRect(0, 70, W, 60);
  text(ctx, 128, 82, 'STUNE MIA', '#ffe066', { align:'center', scale:2 });
  text(ctx, 128, 104, 'RIENTRO A CASA · OSTUNI D\'ESTATE', '#ffffff', { align:'center' });
  text(ctx, 128, 116, 'RECORD: ' + String(G.record2).padStart(9, '0'), '#7fc8ff', { align:'center' });
}
function drawResetConfirm() {
  ctx.fillStyle = 'rgba(4,8,24,.72)'; ctx.fillRect(0, 0, W, H);
  panel(62, 128);
  text(ctx, 128, 70, 'AZZERARE IL RECORD?', '#ffe066', { align:'center', scale:2 });
  text(ctx, 128, 90, 'RECORD ATTUALE: ' + String(G.record).padStart(9, '0'), '#ffffff', { align:'center' });
  text(ctx, 128, 104, 'A / B: SÌ, AZZERA', '#4bd35a', { align:'center' });
  text(ctx, 128, 115, 'SELECT / START: ANNULLA', '#cfe0ff', { align:'center' });
}
function drawTransition() {
  const tr = G.tr, a = Math.max(0, 1 - tr / 24);
  if (a > 0) { ctx.fillStyle = 'rgba(210,240,255,' + a + ')'; ctx.fillRect(0, 0, W, H); }
  const s = Math.max(0, 1 - tr / 44); ctx.fillStyle = 'rgba(0,0,0,' + (s * .6) + ')'; for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
}
function drawHome() {
  const h = G.home; if (!h) return;
  if (h.phase === 1 && h.textT) {
    ctx.fillStyle = 'rgba(10,18,50,.6)'; ctx.fillRect(0, 84, W, 16);
    text(ctx, 128, 88, h.t % 220 < 110 ? 'CASA, FINALMENTE.' : 'STUNE MIA.', '#ffe066', { align:'center' });
  }
  if (h.phase === 4) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, h.t / 26) + ')'; ctx.fillRect(0, 0, W, H); return; }
  if (h.phase < 5) return;
  const t = h.t;
  if (t < 30) { ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - t / 30) + ')'; ctx.fillRect(0, 0, W, H); }
  panel(32, 142);
  if (t > 16) text(ctx, 128, 36, 'STUNE MIA', '#ffe066', { align:'center', scale:2 });
  if (t > 45) text(ctx, 128, 54, 'RIENTRO A CASA', '#ffffff', { align:'center' });
  if (t > 75) text(ctx, 128, 64, 'OSTUNI - TEMPO ' + fmtTime(G.time), '#ffb347', { align:'center' });
  if (t > 105) text(ctx, 128, 74, 'IL SOLE CALA. LA PORTA È APERTA.', '#7fc8ff', { align:'center' });
  if (t > 140) { text(ctx, 128, 86, 'PUNTI', '#cfe0ff', { align:'center' }); text(ctx, 128, 94, String(G.score).padStart(9, '0'), '#ffe066', { align:'center', scale:2 }); }
  if (t > 165) text(ctx, 128, 112, 'RECORD: ' + String(G.record2).padStart(9, '0'), '#7fc8ff', { align:'center' });
  if (t > 180) { if (G.newRecord) { if ((t / 20 | 0) % 2 === 0) text(ctx, 128, 122, 'NUOVO RECORD!', '#4bd35a', { align:'center' }); } else text(ctx, 128, 122, 'FICO ' + G.cfu + '/' + G.cfuTotal + '   BONUS +' + G.finalBonus, '#cfe0ff', { align:'center' }); }
  if (t > 195) { if ((t / 26 | 0) % 2 === 0) text(ctx, 128, 132, 'A: RIGIOCA · B: MENU INIZIALE', '#ffffff', { align:'center' }); }

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  switch (G.mode) {
    case 'title': drawTitle(); break;
    case 'reset': drawTitle(); drawResetConfirm(); break;
    case 'transition': if (G.tr < 14) drawTitle(); else { drawWorld(); drawWeather(); drawHUD(); } drawTransition(); break;
    case 'transition2': if (G.tr < 14) drawLevel2Card(); else { drawWorld(); drawWeather(); drawHUD(); } drawTransition(); break;
    default:
      drawWorld(); drawNightFinale(); drawWeather(); drawHUD(); drawBanner();

  }
}

/* ---------- ciclo principale e avvio ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(120, now - last); last = now; acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render(); requestAnimationFrame(frame);
}
function fit() {
  const st = document.getElementById('stage'), u = Math.min(st.clientWidth / 360, st.clientHeight / 660, 2.4);
  document.documentElement.style.setProperty('--u', u + 'px');
}
Snd.onUnlock = () => { if ((G.mode === 'play' || G.mode === 'transition') && !Music.playing) Music.start(); };
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') pauseGame(false); });
document.getElementById('audio').addEventListener('click', e => { e.preventDefault(); toggleAudio(); });
cvs.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); const r = cvs.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (G.mode === 'title' || G.mode === 'gameover') G.canvasTap = { x, y };
  else if (G.mode === 'home' && G.home && G.home.phase >= 5 && G.home.t > 40) G.canvasTap = { x, y };
  else if (G.mode === 'victory' && x >= VBTN.x - 8 && x <= VBTN.x + VBTN.w + 8 && y >= VBTN.y - 8 && y <= VBTN.y + VBTN.h + 10) G.canvasTap = { x, y }; });
fit(); requestAnimationFrame(frame);
})();
</script>
